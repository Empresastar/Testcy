<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybercracy P2P | Rede Autônoma</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #0f1117;
            --card: #161922;
            --primary: #4dabf7;
            --text: #e9ecef;
            --dim: #868e96;
            --border: #2c2e33;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }

        /* Estética Minimalista */
        .nav { display: flex; justify-content: space-between; padding: 1rem 8%; background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .nav h1 { font-size: 1.1rem; color: var(--primary); font-weight: 800; }
        .tabs button { background: none; border: none; color: var(--dim); padding: 0.5rem 1rem; cursor: pointer; font-weight: 600; }
        .tabs button.active { color: var(--text); border-bottom: 2px solid var(--primary); }

        .container { max-width: 700px; margin: 2rem auto; padding: 0 1.5rem; }
        .section { display: none; }
        .section.active { display: block; animation: slideUp 0.3s ease; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Chat e Cards */
        .glass { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
        .chat-box { height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 1rem; }
        .msg { background: #25262b; padding: 8px 14px; border-radius: 6px 14px 14px 14px; width: fit-content; max-width: 85%; font-size: 0.95rem; }
        .msg.me { align-self: flex-end; background: var(--primary); color: #000; border-radius: 14px 14px 6px 14px; }

        .status-bar { font-size: 0.7rem; color: var(--dim); margin-bottom: 1rem; display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #51cf66; }
        .status-dot.searching { background: #fcc419; animation: blink 1s infinite; }

        input, textarea { width: 100%; background: #25262b; border: 1px solid var(--border); padding: 12px; border-radius: 8px; color: white; margin-bottom: 10px; font-size: 1rem; }
        .btn { background: var(--primary); color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<nav class="nav">
    <h1>CYBERCRACY</h1>
    <div class="tabs">
        <button class="t-btn active" onclick="tab(event, 'chat')">Debate</button>
        <button class="t-btn" onclick="tab(event, 'urna')">Urna</button>
        <button class="t-btn" onclick="tab(event, 'livro')">Livro</button>
    </div>
</nav>

<div class="container">
    <div class="status-bar"><div id="dot" class="status-dot searching"></div> <span id="net-info">Iniciando protocolo P2P...</span></div>

    <section id="chat" class="section active">
        <div class="glass">
            <div id="chat-list" class="chat-box"></div>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="chat-in" placeholder="Escreva sua proposta..." onkeypress="if(event.key==='Enter') send()">
                <button class="btn" onclick="send()">Enviar</button>
            </div>
        </div>
    </section>

    <section id="urna" class="section">
        <div class="glass">
            <h3>Nova PL</h3>
            <input type="text" id="pl-t" placeholder="Título">
            <textarea id="pl-b" placeholder="Texto da Lei..."></textarea>
            <button class="btn" onclick="createPL()">Publicar</button>
        </div>
        <div id="urna-list"></div>
    </section>

    <section id="livro" class="section">
        <div id="livro-list"></div>
    </section>
</div>

<script>
    const ROOM_ID = "cybercracy-global-room-v1"; // ID Único da sala
    let peer = null;
    let connections = []; // Se for host, guarda todos. Se for client, guarda o host.
    let isHost = false;

    // Inicializa a rede
    function initNetwork() {
        // Tenta virar o Host
        peer = new Peer(ROOM_ID);

        peer.on('open', (id) => {
            console.log("Você é o HOST da rede.");
            isHost = true;
            updateStatus("Host Ativo (Servidor Coletivo)");
            setupHost();
        });

        peer.on('error', (err) => {
            if (err.type === 'unavailable-id') {
                // Se o ID já existe, você é um CLIENT
                isHost = false;
                startClient();
            }
        });
    }

    // --- LÓGICA DO HOST ---
    function setupHost() {
        peer.on('connection', (conn) => {
            connections.push(conn);
            updateStatus(`Host: ${connections.length + 1} legisladores online`);
            
            conn.on('data', (data) => {
                // O Host recebe e replica para todos (Broadcast)
                broadcast(data);
                handleData(data);
            });

            conn.on('close', () => {
                connections = connections.filter(c => c.peer !== conn.peer);
                updateStatus(`Host: ${connections.length + 1} online`);
            });
        });
    }

    function broadcast(data) {
        connections.forEach(c => c.send(data));
    }

    // --- LÓGICA DO CLIENTE ---
    function startClient() {
        peer = new Peer(); // Cria um ID aleatório para o cliente
        peer.on('open', (id) => {
            updateStatus("Conectando ao Host...");
            const conn = peer.connect(ROOM_ID);
            
            conn.on('open', () => {
                isHost = false;
                connections = [conn];
                updateStatus("Conectado à rede P2P");
                document.getElementById('dot').classList.remove('searching');
            });

            conn.on('data', (data) => handleData(data));

            conn.on('close', () => {
                updateStatus("Host caiu! Elegendo novo líder...");
                document.getElementById('dot').classList.add('searching');
                // Tenta virar o novo host após um delay aleatório para evitar colisão
                setTimeout(initNetwork, Math.random() * 2000);
            });
        });
    }

    // --- PROCESSAMENTO DE DADOS ---
    let db = JSON.parse(localStorage.getItem('cyber_db')) || [];

    function handleData(data) {
        if(data.type === 'msg') addMsg(data.user, data.val, false);
        if(data.type === 'sync') { db = data.val; renderAll(); }
    }

    function send() {
        const i = document.getElementById('chat-in');
        if(!i.value) return;
        const msg = { type: 'msg', user: 'Legislador', val: i.value };
        
        if(isHost) {
            broadcast(msg);
            addMsg("Você", i.value, true);
        } else if(connections[0]) {
            connections[0].send(msg);
            addMsg("Você", i.value, true);
        }
        i.value = "";
    }

    function addMsg(user, txt, me) {
        const box = document.getElementById('chat-list');
        const div = document.createElement('div');
        div.className = `msg ${me ? 'me' : ''}`;
        div.innerHTML = `<small style="display:block; font-size:0.6rem; opacity:0.6">${user}</small>${txt}`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    // --- INTERFACE ---
    function tab(e, id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.t-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        e.currentTarget.classList.add('active');
        renderAll();
    }

    function updateStatus(txt) {
        document.getElementById('net-info').innerText = txt;
    }

    function createPL() {
        const t = document.getElementById('pl-t').value;
        const b = document.getElementById('pl-b').value;
        if(!t || !b) return;
        db.push({id: Date.now(), t, b, up: 0, status: 'votação'});
        const data = { type: 'sync', val: db };
        isHost ? broadcast(data) : connections[0].send(data);
        renderAll();
    }

    function renderAll() {
        const u = document.getElementById('urna-list');
        const l = document.getElementById('livro-list');
        u.innerHTML = ''; l.innerHTML = '';
        db.forEach(p => {
            const card = `<div class="glass"><h3>${p.t}</h3><p>${p.b}</p></div>`;
            p.status === 'votação' ? u.innerHTML += card : l.innerHTML += card;
        });
        localStorage.setItem('cyber_db', JSON.stringify(db));
    }

    initNetwork();
</script>

</body>
</html>
