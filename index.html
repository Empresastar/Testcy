<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybercracy | Governança Colaborativa</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* Design Humanizado: Foco em Leitura e Conforto */
        :root {
            --bg: #12141c;
            --surface: #1e202a;
            --primary: #5c7cfa;
            --text: #eceef2;
            --text-dim: #9499b0;
            --border: #2d313e;
            --success: #2ecc71;
            --error: #e74c3c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }

        /* Navegação */
        .nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 10%; background: var(--surface); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 10;
        }
        .nav h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: 1px; color: var(--primary); }
        .nav-tabs button {
            background: none; border: none; color: var(--text-dim); padding: 0.8rem 1rem;
            cursor: pointer; font-weight: 500; transition: 0.2s;
        }
        .nav-tabs button.active { color: var(--text); border-bottom: 2px solid var(--primary); }

        /* Conteúdo */
        .wrapper { max-width: 750px; margin: 2rem auto; padding: 0 1.5rem; }
        .section { display: none; animation: fadeIn 0.4s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Chat Estilo Comunidade */
        .chat-container { background: var(--surface); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
        .chat-messages { height: 400px; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 12px; }
        .msg { font-size: 0.95rem; max-width: 85%; }
        .msg-user { color: var(--primary); font-weight: 600; font-size: 0.8rem; margin-bottom: 2px; display: block; }
        .msg-text { background: #2d313e; padding: 10px 14px; border-radius: 4px 14px 14px 14px; width: fit-content; }
        .msg.me { align-self: flex-end; }
        .msg.me .msg-text { background: var(--primary); color: white; border-radius: 14px 14px 4px 14px; }

        .chat-input { display: flex; padding: 1rem; background: #181a23; gap: 10px; }
        input, textarea {
            flex: 1; background: #2d313e; border: 1px solid transparent; 
            padding: 12px 16px; border-radius: 8px; color: white; font-size: 1rem;
        }
        input:focus { outline: none; border-color: var(--primary); }

        /* Cards Legislativos */
        .card { background: var(--surface); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 1rem; }
        .card h3 { margin-bottom: 0.5rem; font-size: 1.1rem; }
        .card p { color: var(--text-dim); font-size: 0.95rem; margin-bottom: 1rem; }

        .btn {
            background: var(--primary); color: white; border: none; padding: 10px 20px;
            border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .btn:hover { filter: brightness(1.1); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

        /* Conexão P2P */
        .p2p-badge { font-size: 0.75rem; background: #181a23; padding: 4px 12px; border-radius: 20px; margin-bottom: 1rem; display: inline-block; border: 1px solid var(--border); }
    </style>
</head>
<body>

<nav class="nav">
    <h1>CYBERCRACY</h1>
    <div class="nav-tabs">
        <button class="tab-link active" onclick="showTab(event, 'chat')">Debate</button>
        <button class="tab-link" onclick="showTab(event, 'editor')">Propor</button>
        <button class="tab-link" onclick="showTab(event, 'urna')">Urna</button>
        <button class="tab-link" onclick="showTab(event, 'livro')">Livro</button>
    </div>
</nav>

<div class="wrapper">
    <div id="status" class="p2p-badge">Aguardando rede...</div>

    <section id="chat" class="section active">
        <div class="chat-container">
            <div id="chat-list" class="chat-messages"></div>
            <div class="chat-input">
                <input type="text" id="chat-in" placeholder="Diga algo aos outros legisladores...">
                <button class="btn" onclick="enviarMensagem()">Enviar</button>
            </div>
        </div>
        <div style="margin-top: 10px; font-size: 0.8rem; color: var(--text-dim);">
            Conectar com amigo: <input type="text" id="peer-target" placeholder="ID do amigo" style="width: 150px; padding: 4px; font-size: 0.8rem;">
            <button onclick="conectarAmigo()" class="btn" style="padding: 4px 8px;">Conectar</button>
        </div>
    </section>

    <section id="editor" class="section">
        <div class="card">
            <h3>Nova Proposta de Lei</h3>
            <input type="text" id="pl-titulo" placeholder="Título da proposta">
            <textarea id="pl-corpo" placeholder="Descreva sua proposta detalhadamente..."></textarea>
            <button class="btn" onclick="criarPL()">Enviar para a Comunidade</button>
        </div>
    </section>

    <section id="urna" class="section">
        <div id="urna-list"></div>
    </section>

    <section id="livro" class="section">
        <div class="card" style="border-left: 3px solid var(--primary);">
            <h3>📜 Constituição Protocolar</h3>
            <p>Este espaço é regido pela colaboração direta e sem intermediários.</p>
        </div>
        <div id="livro-list"></div>
    </section>
</div>

<script>
    // --- LÓGICA P2P (PeerJS) ---
    const peer = new Peer();
    let conn;

    peer.on('open', (id) => {
        document.getElementById('status').innerText = "Seu ID: " + id;
    });

    // Receber conexão
    peer.on('connection', (c) => {
        conn = c;
        escutarDados();
    });

    // Conectar a alguém
    function conectarAmigo() {
        const targetId = document.getElementById('peer-target').value;
        conn = peer.connect(targetId);
        escutarDados();
    }

    function escutarDados() {
        conn.on('open', () => {
            addMensagem("Sistema", "Conexão P2P estabelecida!", false);
            conn.on('data', (data) => {
                if(data.type === 'chat') addMensagem("Legislador", data.val, false);
                if(data.type === 'sync') { leis = data.val; atualizarListas(); }
            });
        });
    }

    // --- FUNCIONAMENTO DO SITE ---
    let leis = JSON.parse(localStorage.getItem('cyber_v3')) || [];

    function showTab(e, name) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-link').forEach(b => b.classList.remove('active'));
        document.getElementById(name).classList.add('active');
        e.currentTarget.classList.add('active');
        atualizarListas();
    }

    function enviarMensagem() {
        const input = document.getElementById('chat-in');
        if(!input.value) return;
        addMensagem("Você", input.value, true);
        if(conn) conn.send({type: 'chat', val: input.value});
        input.value = "";
    }

    function addMensagem(user, texto, isMe) {
        const list = document.getElementById('chat-list');
        const div = document.createElement('div');
        div.className = `msg ${isMe ? 'me' : ''}`;
        div.innerHTML = `<span class="msg-user">${user}</span><div class="msg-text">${texto}</div>`;
        list.appendChild(div);
        list.scrollTop = list.scrollHeight;
    }

    function criarPL() {
        const t = document.getElementById('pl-titulo').value;
        const c = document.getElementById('pl-corpo').value;
        if(!t || !c) return;
        leis.push({id: Date.now(), t, c, sim: 0, nao: 0, status: 'votação'});
        salvar();
        alert("Proposta enviada!");
        if(conn) conn.send({type: 'sync', val: leis});
    }

    function atualizarListas() {
        const urna = document.getElementById('urna-list');
        const livro = document.getElementById('livro-list');
        urna.innerHTML = ''; livro.innerHTML = '';

        leis.forEach(l => {
            const html = `
                <div class="card">
                    <h3>${l.t}</h3>
                    <p>${l.c}</p>
                    ${l.status === 'votação' ? `
                        <button class="btn" onclick="votar(${l.id}, 'sim')">Aprovar (${l.sim})</button>
                        <button class="btn btn-outline" onclick="votar(${l.id}, 'nao')">Reprovar (${l.nao})</button>
                    ` : ''}
                </div>`;
            
            if(l.status === 'votação') urna.innerHTML += html;
            else livro.innerHTML += html;
        });
    }

    function votar(id, tipo) {
        const l = leis.find(x => x.id === id);
        tipo === 'sim' ? l.sim++ : l.nao++;
        if(l.sim >= 3) l.status = 'aprovada';
        salvar();
        atualizarListas();
        if(conn) conn.send({type: 'sync', val: leis});
    }

    function salvar() { localStorage.setItem('cyber_v3', JSON.stringify(leis)); }
    
    window.onload = atualizarListas;
</script>

</body>
</html>
