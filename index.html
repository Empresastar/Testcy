<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybercracy P2P | Sistema Legislativo</title>
    <style>
        :root {
            --primary: #00d2ff;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --success: #10b981;
            --danger: #ef4444;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--dark-bg); color: var(--text); margin: 0; }
        
        /* Interface e Navegação */
        .navbar { 
            background: var(--card-bg); padding: 1rem 5%; display: flex; 
            justify-content: space-between; align-items: center; 
            border-bottom: 2px solid var(--primary); position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 1.5rem; font-weight: bold; }
        .logo span { color: var(--primary); }
        .tabs button { 
            background: none; border: none; color: #94a3b8; 
            padding: 10px 15px; cursor: pointer; font-weight: bold; font-size: 1rem;
        }
        .tabs button.active { color: var(--primary); border-bottom: 2px solid var(--primary); }

        .container { max-width: 800px; margin: 2rem auto; padding: 0 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Estilo do Chat */
        .chat-area { 
            background: #000; height: 300px; overflow-y: auto; 
            border-radius: 10px; padding: 20px; border: 1px solid #334155; margin-bottom: 15px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .msg { background: #334155; padding: 10px; border-radius: 8px; width: fit-content; max-width: 80%; }
        .msg.system { background: rgba(0, 210, 255, 0.1); color: var(--primary); align-self: center; width: 90%; text-align: center; }

        .input-group { display: flex; gap: 10px; }
        input, textarea { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; }

        /* Botões e Cards */
        .btn { background: var(--primary); color: #000; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 20px; border-left: 5px solid var(--primary); }
        .vote-btns { display: flex; gap: 10px; margin-top: 15px; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">CYBER<span>CRACY</span></div>
        <nav class="tabs">
            <button class="tab-link active" onclick="openTab(event, 'chat')">Chat</button>
            <button class="tab-link" onclick="openTab(event, 'editor')">Editor</button>
            <button class="tab-link" onclick="openTab(event, 'urna')">Urna</button>
            <button class="tab-link" onclick="openTab(event, 'livro')">Livro</button>
        </nav>
    </header>

    <div class="container">
        <section id="chat" class="tab-content active">
            <h2>🗨️ Chat Público</h2>
            <div id="chat-box" class="chat-area">
                <div class="msg system">Conectado ao rito de debates filosóficos.</div>
            </div>
            <div class="input-group">
                <input type="text" id="chat-input" placeholder="Sua mensagem...">
                <button class="btn" onclick="sendMessage()">Enviar</button>
            </div>
        </section>

        <section id="editor" class="tab-content">
            <h2>📝 Criar Projeto de Lei</h2>
            <div class="card">
                <input type="text" id="pl-title" placeholder="Título da PL" style="width: 100%; margin-bottom: 10px; box-sizing: border-box;">
                <textarea id="pl-text" placeholder="Texto da lei..." style="width: 100%; height: 100px; box-sizing: border-box;"></textarea>
                <button class="btn" onclick="publishPL()" style="width: 100%; margin-top: 10px;">Publicar na Urna</button>
            </div>
        </section>

        <section id="urna" class="tab-content">
            <h2>🗳️ Urna Livre</h2>
            <div id="urna-list"></div>
        </section>

        <section id="livro" class="tab-content">
            <h2>📖 Livro da Lei</h2>
            <div id="livro-list"></div>
        </section>
    </div>

    <script>
        // Lógica do Sistema
        let db = JSON.parse(localStorage.getItem('cyber_p2p_db')) || [];

        // FUNÇÃO DAS ABAS (Resolve o ReferenceError)
        function openTab(evt, tabName) {
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(c => c.classList.remove('active'));
            
            const links = document.querySelectorAll('.tab-link');
            links.forEach(l => l.classList.remove('active'));

            document.getElementById(tabName).classList.add('active');
            evt.currentTarget.classList.add('active');

            if(tabName === 'urna') renderUrna();
            if(tabName === 'livro') renderLivro();
        }

        // FUNÇÃO ENVIAR MENSAGEM
        function sendMessage() {
            const input = document.getElementById('chat-input');
            const box = document.getElementById('chat-box');
            if(!input.value.trim()) return;

            const msg = document.createElement('div');
            msg.className = 'msg';
            msg.innerHTML = `<strong>Legislador:</strong> ${input.value}`;
            box.appendChild(msg);
            input.value = "";
            box.scrollTop = box.scrollHeight;
        }

        // FUNÇÃO PUBLICAR PL
        function publishPL() {
            const title = document.getElementById('pl-title').value;
            const text = document.getElementById('pl-text').value;
            if(!title || !text) return alert("Preencha tudo!");

            db.push({ id: Date.now(), title, text, up: 0, down: 0, status: 'voting' });
            localStorage.setItem('cyber_p2p_db', JSON.stringify(db));
            alert("Publicado!");
            document.getElementById('pl-title').value = "";
            document.getElementById('pl-text').value = "";
        }

        function renderUrna() {
            const list = document.getElementById('urna-list');
            list.innerHTML = '';
            db.filter(p => p.status === 'voting').forEach(p => {
                list.innerHTML += `
                    <div class="card">
                        <h3>${p.title}</h3>
                        <p>${p.text}</p>
                        <div class="vote-btns">
                            <button class="btn" style="background:var(--success)" onclick="vote(${p.id}, 'up')">Aprovar (${p.up})</button>
                            <button class="btn" style="background:var(--danger)" onclick="vote(${p.id}, 'down')">Recusar (${p.down})</button>
                        </div>
                    </div>`;
            });
        }

        function vote(id, type) {
            const p = db.find(x => x.id === id);
            type === 'up' ? p.up++ : p.down++;
            if(p.up >= 3) p.status = 'approved';
            localStorage.setItem('cyber_p2p_db', JSON.stringify(db));
            renderUrna();
        }

        function renderLivro() {
            const list = document.getElementById('livro-list');
            list.innerHTML = '<div class="card"><h3>📜 LP-01: Protocolo de Uso</h3><p>As funções do software são regidas por este código.</p></div>';
            db.filter(p => p.status === 'approved').forEach(p => {
                list.innerHTML += `<div class="card"><h3>📜 ${p.title}</h3><p>${p.text}</p></div>`;
            });
        }
    </script>
</body>
</html>
