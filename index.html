<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybercracy P2P</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">CYBERCRACY <span>P2P</span></div>
        <nav class="tabs">
            <button class="tab-btn active" onclick="openTab(event, 'chat')">Chat</button>
            <button class="tab-btn" onclick="openTab(event, 'editor')">Editor</button>
            <button class="tab-btn" onclick="openTab(event, 'urna')">Urna</button>
            <button class="tab-btn" onclick="openTab(event, 'livro')">Livro</button>
        </nav>
    </header>

    <main class="container">
        <section id="chat" class="tab-content active">
            <h2>🗨️ Chat Público</h2>
            <div id="chat-box" class="display-area"></div>
            <div class="input-group">
                <input type="text" id="chat-input" placeholder="Debata aqui...">
                <button onclick="sendMessage()">Enviar</button>
            </div>
        </section>

        <section id="editor" class="tab-content">
            <h2>📝 Criar Projeto de Lei</h2>
            <div class="form-card">
                <input type="text" id="pl-title" placeholder="Título da PL">
                <textarea id="pl-text" placeholder="Conteúdo da lei..."></textarea>
                <button class="btn-main" onclick="publishPL()">Publicar</button>
            </div>
        </section>

        <section id="urna" class="tab-content">
            <h2>🗳️ Urna Livre</h2>
            <div id="urna-list" class="grid-container"></div>
        </section>

        <section id="livro" class="tab-content">
            <h2>📖 Livro da Lei</h2>
            <div id="livro-list" class="grid-container"></div>
        </section>
    </main>

    <script src="assets/js/script.js"></script>
</body>
</html>
