<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybercracy P2P | Light & Fast</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --primary: #00d2ff;
            --accent: #3a47d5;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --glass: rgba(30, 41, 59, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            /* Gradiente estático é muito mais leve que animado */
            background-image: radial-gradient(circle at 50% -20%, #1e40af, #0f172a 80%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* Navbar fixa e leve */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 5%; background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky; top: 0; z-index: 100;
        }

        .logo { font-size: 1.25rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .logo span { color: var(--primary); }

        .tabs button {
            background: none; border: none; color: #94a3b8;
            padding: 10px 15px; cursor: pointer; font-weight: 600;
            transition: color 0.2s;
        }

        .tabs button.active { color: var(--primary); }

        /* Container centralizado */
        .container { max-width: 800px; margin: 2rem auto; padding: 0 20px; }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: simpleFade 0.3s ease-in; }

        @keyframes simpleFade { from { opacity: 0; } to { opacity: 1; } }

        /* Cards estilo Moderno (sem blur pesado para não travar) */
        .card {
            background: var(--card); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Chat */
        .chat-box {
            height: 300px; overflow-y: auto; background: rgba(0,0,0,0.2);
            border-radius: 8px; padding: 15px; margin-bottom: 15px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .bubble { background: #334155; padding: 8px 12px; border-radius: 12px; width: fit-content; max-width: 85%; font-size: 0.95rem; }
        .bubble.me { align-self: flex-end; background: var(--accent); color: white; }

        /* Status P2P */
        .status-bar { font-size: 0.75rem; color: var(--primary); margin-bottom: 1rem; display: flex; align-items: center; gap: 5px; }
        .pulse { width: 6px; height: 6px; background: var(--primary); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* Inputs e Botões */
        input, textarea {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155;
            background: #0f172a; color: white; margin-bottom: 10px;
        }
        .btn {
            background: var(--primary); color: #0f172a; border: none;
            padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;
            width: 100%; transition: opacity 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-vote { width: auto; padding: 6px 15px; margin-right: 10px; }

    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">CYBER<span>CRACY</span></div>
        <nav class="tabs">
            <button class="t-link active" onclick="tab(event, 'chat')">Chat</button>
            <button class="t-link" onclick="tab(event, 'editor')">Editor</button>
            <button class="t-link" onclick="tab(event, 'urna')">Urna</button>
            <button class="t-link" onclick="tab(event, 'livro')">Livro</button>
        </nav>
    </header>

    <main class="container">
        <div class="status-bar"><div class="pulse"></div> <span id="peer-status">Iniciando Rede P2P...</span></div>

        <section id="chat" class="tab-content active">
            <div class="card">
                <div class="chat-box" id="chat-display"></div>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="msg-in" placeholder="Mensagem..." style="margin:0">
                    <button class="btn" style="width: 80px;" onclick="send()">Enviar</button>
                </div>
            </div>
        </section>

        <section id="editor" class="tab-content">
            <div class="card">
                <h2>Criar Projeto de Lei</h2>
                <input type="text" id="pl-t" placeholder="Título do Projeto">
                <textarea id="pl-b" placeholder="Texto da proposta..."></textarea>
                <button class="btn" onclick="createPL()">Publicar na Urna</button>
            </div>
        </section>

        <section id="urna" class="tab-content">
            <div id="urna-list"></div>
        </section>

        <section id="livro" class="tab-content">
            <div id="livro-list"></div>
        </section>
    </main>

    <script>
        // --- LOGICA P2P AUTOMATICA ---
        // Ele tenta ser HOST. Se falhar ou se alguém conectar, ele vira CLIENT.
        const peer = new Peer('cyber-room-123'); // ID de sala fixo para teste simples
        let connection;

        peer.on('open', id => {
            document.getElementById('peer-status').innerText = "Rede Ativa: " + id;
            // Tenta conectar automaticamente a si mesmo para testar ou a outro peer
            let conn = peer.connect('cyber-room-123'); 
            handleConn(conn);
        });

        peer.on('connection', conn => {
            handleConn(conn);
        });

        function handleConn(conn) {
            connection = conn;
            conn.on('data', data => {
                if(data.type === 'chat') addMsg(data.val, false);
                if(data.type === 'sync') { db = data.val; save(); }
            });
        }

        // --- INTERFACE ---
        let db = JSON.parse(localStorage.getItem('cyber_p2p_fast')) || [];

        function tab(e, id) {
            document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.t-link').forEach(x => x.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            e.currentTarget.classList.add('active');
            if(id === 'urna') renderUrna();
            if(id === 'livro') renderLivro();
        }

        function send() {
            const i = document.getElementById('msg-in');
            if(!i.value) return;
            addMsg(i.value, true);
            if(connection) connection.send({type: 'chat', val: i.value});
            i.value = "";
        }

        function addMsg(txt, me) {
            const b = document.getElementById('chat-display');
            const d = document.createElement('div');
            d.className = `bubble ${me ? 'me' : ''}`;
            d.innerText = txt;
            b.appendChild(d);
            b.scrollTop = b.scrollHeight;
        }

        function createPL() {
            const t = document.getElementById('pl-t').value;
            const b = document.getElementById('pl-b').value;
            if(!t || !b) return;
            db.push({id: Date.now(), t, b, up:0, down:0, status:'voting'});
            save();
            alert("PL Protocolada!");
            if(connection) connection.send({type: 'sync', val: db});
        }

        function renderUrna() {
            const l = document.getElementById('urna-list');
            l.innerHTML = '';
            db.filter(x => x.status === 'voting').forEach(p => {
                l.innerHTML += `<div class="card"><h3>${p.t}</h3><p>${p.b}</p>
                <div style="margin-top:10px">
                    <button class="btn btn-vote" onclick="vote(${p.id}, 'up')">Aprovar (${p.up})</button>
                    <button class="btn btn-vote" style="background:#ef4444" onclick="vote(${p.id}, 'down')">Recusar (${p.down})</button>
                </div></div>`;
            });
        }

        function vote(id, type) {
            const p = db.find(x => x.id === id);
            type === 'up' ? p.up++ : p.down++;
            if(p.up >= 3) p.status = 'approved';
            save();
            renderUrna();
            if(connection) connection.send({type: 'sync', val: db});
        }

        function renderLivro() {
            const l = document.getElementById('livro-list');
            l.innerHTML = '<div class="card"><h3>📜 LP-01: Constituição Digital</h3><p>O poder emana do código e do consenso.</p></div>';
            db.filter(x => x.status === 'approved').forEach(p => {
                l.innerHTML += `<div class="card"><h3>📜 ${p.t}</h3><p>${p.b}</p></div>`;
            });
        }

        function save() { localStorage.setItem('cyber_p2p_fast', JSON.stringify(db)); }
    </script>
</body>
</html>
