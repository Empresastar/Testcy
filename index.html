<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --blue: #00d2ff; --bg: #0f172a; --red: #ff4444; --green: #00ff88; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; }
        .header { background: #000; padding: 10px; text-align: center; border-bottom: 1px solid #333; }
        nav { display: flex; background: #111; }
        nav button { flex: 1; padding: 15px; background: none; border: none; color: #777; font-weight: bold; cursor: pointer; }
        nav button.active { color: var(--blue); border-bottom: 2px solid var(--blue); }
        .container { padding: 20px; max-width: 600px; margin: auto; }
        .view { display: none; } .active { display: block; }
        .card { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #333; position: relative; }
        .btn-vote-sim { background: var(--green); color: #000; border: none; padding: 10px; width: 48%; cursor: pointer; font-weight: bold; border-radius: 5px; }
        .btn-vote-nao { background: var(--red); color: #fff; border: none; padding: 10px; width: 48%; cursor: pointer; font-weight: bold; border-radius: 5px; }
        .btn-del { background: none; color: var(--red); border: 1px solid var(--red); padding: 5px; cursor: pointer; font-size: 10px; margin-top: 10px; }
        #chat { height: 200px; overflow-y: auto; background: #000; padding: 10px; border: 1px solid #333; margin-bottom: 10px; font-size: 14px; }
        input, textarea { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; background: #000; color: #fff; border: 1px solid #333; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="header">
        <div id="clock" style="font-family: monospace; color: var(--green);">00:00:00</div>
    </div>
    <nav>
        <button onclick="tab('urna',this)" class="active">URNA</button>
        <button onclick="tab('livro',this)">LIVRO</button>
        <button onclick="tab('edit',this)">CRIAR</button>
        <button onclick="tab('chat',this)">CHAT</button>
    </nav>

    <div class="container">
        <div id="v-urna" class="view active"><h3>Votação em Aberto</h3><div id="ulist"></div></div>
        <div id="v-livro" class="view"><h3>Leis em Vigor</h3><div id="llist"></div></div>
        <div id="v-edit" class="view">
            <input type="text" id="plt" placeholder="Título do Projeto">
            <textarea id="plb" rows="4" placeholder="Escreva sua lei..."></textarea>
            <button style="background:var(--blue); color:white; padding:15px; width:100%; border:none; border-radius:8px; font-weight:bold; cursor:pointer;" onclick="sendPL()">PUBLICAR PARA VOTAÇÃO</button>
        </div>
        <div id="v-chat" class="view">
            <div id="chat"></div>
            <input type="text" id="cin" placeholder="Mensagem...">
            <button style="background:var(--blue); border:none; color:white; padding:10px; width:100%;" onclick="sendChat()">ENVIAR</button>
        </div>
    </div>

    <script>
        setInterval(() => { document.getElementById('clock').innerText = "SISTEMA SINCRONIZADO: " + new Date().toLocaleTimeString(); }, 1000);
        let peer = new Peer(), conn, myId;
        peer.on('open', id => { myId = id; conn = peer.connect("CYBER_HUB_GLOBAL"); setup(); });
        
        function setup() { conn.on('data', d => { if(d.tipo === 'SYNC') render(d.data); }); }
        
        function tab(v, b) {
            document.querySelectorAll('.view, nav button').forEach(x => x.classList.remove('active'));
            document.getElementById('v-'+v).classList.add('active'); b.classList.add('active');
        }

        function sendPL() {
            const pl = { id: Date.now(), t: document.getElementById('plt').value, b: document.getElementById('plb').value, autor: myId, sim: 0, nao: 0 };
            conn.send({ tipo: 'PL', pl: pl, sender: myId });
            tab('urna', document.querySelector('nav button'));
        }

        function votar(id, escolha) { conn.send({ tipo: 'VOTAR', id: id, voto: escolha, sender: myId }); }
        function remover(id) { if(confirm("Apagar seu projeto?")) conn.send({ tipo: 'REMOVER', id: id }); }
        function sendChat() { conn.send({ tipo: 'CHAT', sender: myId.substring(0,4), msg: document.getElementById('cin').value }); document.getElementById('cin').value = ""; }

        function render(db) {
            document.getElementById('ulist').innerHTML = db.urna.map(p => `
                <div class="card">
                    <b>${p.t}</b><p style="font-size:14px">${p.b}</p>
                    <div style="display:flex; justify-content:space-between">
                        <button class="btn-vote-sim" onclick="votar(${p.id}, 'SIM')">SIM (${p.sim})</button>
                        <button class="btn-vote-nao" onclick="votar(${p.id}, 'NAO')">NÃO (${p.nao})</button>
                    </div>
                    ${p.autor === myId ? `<button class="btn-del" onclick="remover(${p.id})">✖ APAGAR MEU PROJETO</button>` : ''}
                </div>`).join('');
            
            document.getElementById('llist').innerHTML = db.livro.map(l => `<div class="card" style="border-left:5px solid var(--green)"><b>${l.t}</b><p>${l.b}</p></div>`).join('');
            document.getElementById('chat').innerHTML = db.chat.map(m => `<div><b>${m.sender}:</b> ${m.msg}</div>`).join('');
            const c = document.getElementById('chat'); c.scrollTop = c.scrollHeight;
        }
    </script>
</body>
</html>
