<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybercracy P2P | Sistema Legislativo</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">CYBER<span>CRACY</span></div>
        <nav class="tabs">
            <button class="tab-btn active" onclick="openTab(event, 'chat')">Chat</button>
            <button class="tab-btn" onclick="openTab(event, 'editor')">Editor</button>
            <button class="tab-btn" onclick="openTab(event, 'urna')">Urna</button>
            <button class="tab-btn" onclick="openTab(event, 'livro')">Livro</button>
        </nav>
    </header>

    <main class="container">
        <section id="chat" class="tab-content active">
            <h2>🗨️ Debate Coletivo</h2>
            <div id="chat-box" class="chat-area"></div>
            <div class="chat-input-group">
                <input type="text" id="chat-input" placeholder="Digite sua mensagem...">
                <button class="btn-send" id="btn-chat-send">Enviar</button>
            </div>
        </section>

        <section id="editor" class="tab-content">
            <h2>📝 Novo Projeto de Lei</h2>
            <div class="card-form">
                <input type="text" id="pl-title" placeholder="Título da PL">
                <textarea id="pl-text" placeholder="Descreva o projeto..."></textarea>
                <button class="btn-publish" onclick="publishPL()">Publicar na Urna</button>
            </div>
        </section>

        <section id="urna" class="tab-content">
            <h2>🗳️ Urna de Votação</h2>
            <div id="urna-list" class="grid-container"></div>
        </section>

        <section id="livro" class="tab-content">
            <h2>📖 Livro da Lei</h2>
            <div id="livro-list" class="grid-container"></div>
        </section>
    </main>

    <script src="assets/js/script.js"></script>
</body>
</html>
