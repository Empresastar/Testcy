<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --blue: #00d2ff; --bg: #0f172a; --card: #1e293b; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; }
        nav { display: flex; background: #000; sticky; top: 0; }
        nav button { flex: 1; padding: 15px; background: none; border: none; color: #777; font-weight: bold; cursor: pointer; }
        nav button.active { color: var(--blue); border-bottom: 2px solid var(--blue); }
        .main { padding: 20px; max-width: 600px; margin: auto; }
        .view { display: none; } .active { display: block; }
        .urna-card { background: linear-gradient(135deg, #001a33, #0044cc); padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--blue); }
        .livro-card { background: var(--card); border-left: 5px solid #00ff88; padding: 15px; border-radius: 10px; margin-bottom: 10px; }
        #chat-box { height: 300px; overflow-y: auto; background: #000; border-radius: 10px; padding: 10px; margin-bottom: 10px; border: 1px solid #333; }
        input, textarea { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; }
        .btn { background: var(--blue); color: #fff; border: none; padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <nav>
        <button onclick="tab('chat',this)" class="active">CHAT</button>
        <button onclick="tab('urna',this)">URNA AZUL</button>
        <button onclick="tab('livro',this)">LIVRO</button>
        <button onclick="tab('edit',this)">CRIAR</button>
    </nav>
    <div class="main">
        <div id="v-chat" class="view active">
            <div id="chat-box"></div>
            <input type="text" id="cin" placeholder="Diga algo...">
            <button class="btn" onclick="sendChat()">ENVIAR</button>
        </div>
        <div id="v-urna" class="view"></div>
        <div id="v-livro" class="view"></div>
        <div id="v-edit" class="view">
            <input type="text" id="plt" placeholder="Título da PL">
            <textarea id="plb" rows="4" placeholder="Texto da lei..."></textarea>
            <button class="btn" onclick="sendPL()">PUBLICAR NA URNA</button>
        </div>
    </div>
    <script>
        let peer = new Peer(), conn, myId;
        peer.on('open', id => { myId = id; conn = peer.connect("CYBER_HUB_GLOBAL"); setup(); });
        function setup() {
            conn.on('data', d => { if(d.tipo === 'SYNC') render(d.data); });
        }
        function tab(v, b) {
            document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
            document.getElementById('v-'+v).classList.add('active'); b.classList.add('active');
        }
        function sendChat() {
            conn.send({ tipo: 'CHAT', sender: myId.substring(0,4), msg: document.getElementById('cin').value });
            document.getElementById('cin').value = "";
        }
        function sendPL() {
            const pl = { id: Date.now(), t: document.getElementById('plt').value, b: document.getElementById('plb').value, autor: myId, status: 'URNA' };
            conn.send({ tipo: 'PL', pl: pl, sender: myId });
            tab('urna', document.querySelectorAll('nav button')[1]);
        }
        function render(db) {
            document.getElementById('chat-box').innerHTML = db.chat.map(m => `<div><b>${m.sender}:</b> ${m.msg}</div>`).join('');
            document.getElementById('v-urna').innerHTML = db.urna.map(p => `<div class="urna-card"><b>${p.t}</b><p>${p.b}</p></div>`).join('');
            document.getElementById('v-livro').innerHTML = db.livro.map(l => `<div class="livro-card"><b>${l.t}</b><p>${l.b}</p></div>`).join('');
            const cb = document.getElementById('chat-box'); cb.scrollTop = cb.scrollHeight;
        }
    </script>
</body>
</html>
