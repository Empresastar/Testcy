<!DOCTYPE html>
<html>
<head>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: monospace; background: #000; color: #0f0; padding: 10px; margin:0; font-size: 12px; }
        #log { border: 1px solid #0f0; height: 250px; overflow-y: auto; padding: 5px; background: #050505; }
    </style>
</head>
<body>
    <h4 style="margin:5px 0">DB - MEMÓRIA PERMANENTE</h4>
    <div id="log">Lendo dados do disco...</div>
    <script>
        const ID_SALA = "sala_secreta_p2p_2026_xyz";
        const peer = new Peer(ID_SALA);
        let conexoes = [];
        let historicoDePosts = JSON.parse(localStorage.getItem('meu_insta_p2p')) || [];
        peer.on('open', () => log(`Online. Posts: ${historicoDePosts.length}`));
        peer.on('connection', (conn) => {
            conexoes.push(conn);
            conn.on('open', () => { if(historicoDePosts.length > 0) conn.send({ tipo: "historico", posts: historicoDePosts }); });
            conn.on('data', (data) => {
                if (data.tipo === "post") {
                    historicoDePosts.push(data);
                    localStorage.setItem('meu_insta_p2p', JSON.stringify(historicoDePosts));
                    log("Novo post salvo.");
                    conexoes.forEach(c => { if(c.open) c.send(data); });
                } else if (data.tipo === "limpar") {
                    historicoDePosts = [];
                    localStorage.removeItem('meu_insta_p2p');
                    log("Banco resetado.");
                    conexoes.forEach(c => { if(c.open) c.send(data); });
                }
            });
        });
        function log(m) {
            const l = document.getElementById('log');
            l.innerHTML += `<div>> ${m}</div>`;
            l.scrollTop = l.scrollHeight;
        }
    </script>
</body>
</html></textarea>
        <div class="preview-box">
            <iframe id="preview1"></iframe>
        </div>
    </div>

        <textarea id="code2">
<!DOCTYPE html>
<html>
<head>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #fafafa; margin: 0; padding: 10px; }
        .post { background: white; border: 1px solid #dbdbdb; margin-bottom: 15px; border-radius: 8px; }
        .post img { width: 100%; display: block; }
        .caption { padding: 8px; font-size: 12px; }
    </style>
</head>
<body>
    <div id="feed">Aguardando conexão...</div>
    <script>
        const ID_SALA = "sala_secreta_p2p_2026_xyz";
        const peer = new Peer();
        const feed = document.getElementById('feed');
        function criarPost(data) {
            const div = document.createElement('div');
            div.className = 'post';
            div.innerHTML = `<img src="${data.url}"><div class="caption"><b>admin</b> ${data.msg}</div>`;
            feed.insertBefore(div, feed.firstChild);
        }
        peer.on('open', () => {
            const conn = peer.connect(ID_SALA);
            conn.on('data', (data) => {
                if (data.tipo === "historico") { feed.innerHTML = ""; data.posts.forEach(p => criarPost(p)); }
                else if (data.tipo === "post") { if(feed.innerText.includes("Aguardando")) feed.innerHTML=""; criarPost(data); }
                else if (data.tipo === "limpar") { feed.innerHTML = "Banco limpo."; }
            });
        });
    </script>
</body>
</html></textarea>

<!DOCTYPE html>
<html>
<head>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #262626; color: white; padding: 15px; margin:0; }
        input { width: 100%; padding: 8px; margin: 5px 0; border-radius: 4px; border: none; }
        button { background: #0095f6; color: white; width: 100%; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 5px;}
    </style>
</head>
<body>
    <h4>POSTAR</h4>
    <input type="text" id="url" placeholder="Link da imagem">
    <input type="text" id="msg" placeholder="Legenda">
    <button onclick="enviar()">Publicar</button>
    <script>
        const ID_SALA = "sala_secreta_p2p_2026_xyz";
        const peer = new Peer();
        let conn;
        peer.on('open', () => { conn = peer.connect(ID_SALA); });
        function enviar() {
            const u = document.getElementById('url').value || "https://picsum.photos/400/400";
            const m = document.getElementById('msg').value || "Post mobile.";
            if(conn && conn.open) { conn.send({ tipo: "post", url: u, msg: m }); }
        }
    </script>
</body>
</html></textarea>
        <div class="preview-box">
            <iframe id="preview3"></iframe>
        </div>
    </div>

    <script>
        function render(id) {
            const code = document.getElementById('code' + id).value;
            const preview = document.getElementById('preview' + id).contentWindow.document;
            preview.open();
            preview.write(code);
            preview.close();
        }

        [1, 2, 3].forEach(id => {
            const area = document.getElementById('code' + id);
            area.addEventListener('input', () => render(id));
            render(id);
        });
    </script>

</body>
